<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- 顶部导航 -->
  <rect x="0" y="0" width="1280" height="58" fill="#0c1322" opacity="0.85"/>
  <circle cx="40" cy="29" r="8" fill="#22d3ee"/>
  <text x="56" y="35" fill="#e2e8f0" font-size="17" font-weight="700">Hermes</text>
  <text x="900" y="34" fill="#94a3b8" font-size="14">网络工具</text>
  <text x="1000" y="34" fill="#94a3b8" font-size="14">Aegis 安全</text>
  <text x="1110" y="34" fill="#94a3b8" font-size="14">实用工具</text>
  <circle cx="1235" cy="29" r="12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 中间分隔 -->
  <line x1="640" y1="58" x2="640" y2="720" stroke="#1e293b" stroke-width="1" opacity="0.5"/>

  <!-- 左：Hero -->
  <rect x="160" y="200" width="70" height="70" rx="20" fill="#22d3ee" opacity="0.12"/>
  <path d="M185 225 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" fill="#22d3ee"/>
  <text x="170" y="330" fill="#eaf6ff" font-size="44" font-weight="800">Hermes</text>
  <text x="170" y="370" fill="#94a3b8" font-size="17">简约、高效、注重隐私的网络工具集</text>
  <text x="170" y="396" fill="#94a3b8" font-size="17">在线检测 · 安全评估 · 色彩转换 · 哈希校验</text>

  <!-- CTA 按钮 -->
  <rect x="170" y="430" width="150" height="44" rx="22" fill="url(#accent)"/>
  <text x="245" y="457" fill="#04121a" font-size="15" font-weight="700" text-anchor="middle">开始探索</text>

  <!-- 右：三个特性卡片 -->
  <rect x="700" y="170" width="210" height="150" rx="16" fill="#0c1322" stroke="#22d3ee" stroke-opacity="0.2"/>
  <circle cx="805" cy="210" r="14" fill="#22d3ee" opacity="0.15"/>
  <path d="M800 210 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3 z" fill="#22d3ee"/>
  <text x="805" y="255" fill="#e2e8f0" font-size="17" font-weight="700" text-anchor="middle">隐私优先</text>
  <text x="805" y="282" fill="#64748b" font-size="12.5" text-anchor="middle">核心工具浏览器本地运行</text>
  <text x="805" y="301" fill="#64748b" font-size="12.5" text-anchor="middle">数据不上传服务器</text>

  <rect x="940" y="170" width="210" height="150" rx="16" fill="#0c1322" stroke="#22d3ee" stroke-opacity="0.2"/>
  <circle cx="1045" cy="210" r="14" fill="#22d3ee" opacity="0.15"/>
  <path d="M1041 214 l8 -8 2 2 -8 8 z M1045 202 l6 6 -2 2 -6 -6 z" fill="#22d3ee"/>
  <text x="1045" y="255" fill="#e2e8f0" font-size="17" font-weight="700" text-anchor="middle">极速响应</text>
  <text x="1045" y="282" fill="#64748b" font-size="12.5" text-anchor="middle">轻量纯前端实现</text>
  <text x="1045" y="301" fill="#64748b" font-size="12.5" text-anchor="middle">随开随用</text>

  <rect x="700" y="350" width="210" height="150" rx="16" fill="#0c1322" stroke="#22d3ee" stroke-opacity="0.2"/>
  <circle cx="805" cy="390" r="14" fill="#22d3ee" opacity="0.15"/>
  <rect x="797" y="383" width="16" height="16" rx="4" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="805" y="435" fill="#e2e8f0" font-size="17" font-weight="700" text-anchor="middle">工具集</text>
  <text x="805" y="462" fill="#64748b" font-size="12.5" text-anchor="middle">一站式汇聚</text>
  <text x="805" y="481" fill="#64748b" font-size="12.5" text-anchor="middle">网络 / 安全 / 创作</text>

  <rect x="940" y="350" width="210" height="150" rx="16" fill="#0c1322" stroke="#22d3ee" stroke-opacity="0.2"/>
  <circle cx="1045" cy="390" r="14" fill="#22d3ee" opacity="0.15"/>
  <circle cx="1045" cy="390" r="7" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1045" y="435" fill="#e2e8f0" font-size="17" font-weight="700" text-anchor="middle">开源构建</text>
  <text x="1045" y="462" fill="#64748b" font-size="12.5" text-anchor="middle">Docker 一键部署</text>
  <text x="1045" y="481" fill="#64748b" font-size="12.5" text-anchor="middle">PHP + 原生前端</text>

  <!-- 底部 -->
  <text x="640" y="690" fill="#475569" font-size="13" text-anchor="middle">© iCerya · Hermes</text>
</svg>
